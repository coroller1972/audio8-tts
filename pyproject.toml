[project]
name = "audio8-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.3",
  "onnxruntime==1.24.4",
  "soundfile==0.13.1",
  "scipy==1.17.1",
  "fastapi==0.135.2",
  "uvicorn==0.42.0",
  "pydantic>=2.9,<3",
  "python-multipart==0.0.22",
  "tokenizers>=0.22,<0.24",
  "huggingface-hub>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["backend/third_party", "vendor"]
line-length = 100
